<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="lensGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:0.5" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="300" fill="#0a0f1a" rx="16"/>

  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#111827" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="300" fill="url(#grid)" rx="16"/>

  <g transform="translate(130, 150)">
    <line x1="35" y1="35" x2="70" y2="70" stroke="url(#mainGrad)" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#mainGrad)" stroke-width="6" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="39" fill="url(#lensGrad)"/>

    <g opacity="0.85">
      <circle cx="-5" cy="-5" r="5" fill="#3b82f6" filter="url(#glow)"/>
      <circle cx="-18" cy="-12" r="3.5" fill="#06b6d4"/>
      <circle cx="12" cy="-15" r="3" fill="#8b5cf6"/>
      <circle cx="18" cy="8" r="3.5" fill="#3b82f6"/>
      <circle cx="-8" cy="18" r="3" fill="#8b5cf6"/>
      <circle cx="5" cy="12" r="2.5" fill="#06b6d4"/>

      <line x1="-5" y1="-5" x2="-18" y2="-12" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
      <line x1="-5" y1="-5" x2="12" y2="-15" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
      <line x1="-5" y1="-5" x2="18" y2="8" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
      <line x1="-5" y1="-5" x2="-8" y2="18" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
      <line x1="-5" y1="-5" x2="5" y2="12" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
      <line x1="-18" y1="-12" x2="12" y2="-15" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
      <line x1="18" y1="8" x2="-8" y2="18" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    </g>

    <path d="M -30 -25 A 35 35 0 0 1 -5 -35" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <g transform="translate(210, 150)">
    <text x="0" y="-5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#mainGrad)" letter-spacing="1" filter="url(#shadow)">
      Vestigia
    </text>
    <text x="2" y="28" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b" letter-spacing="3">
      LLM FINGERPRINT DETECTOR
    </text>
    <line x1="2" y1="42" x2="180" y2="42" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <g opacity="0.35">
    <circle cx="520" cy="80" r="2.5" fill="#3b82f6"/>
    <circle cx="545" cy="95" r="1.8" fill="#8b5cf6"/>
    <circle cx="535" cy="115" r="2" fill="#06b6d4"/>
    <circle cx="555" cy="130" r="1.5" fill="#3b82f6"/>
    <circle cx="80" cy="220" r="2" fill="#06b6d4"/>
    <circle cx="60" cy="240" r="1.5" fill="#8b5cf6"/>
    <circle cx="85" cy="255" r="2.2" fill="#3b82f6"/>
  </g>
</svg>